<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <h1 class="brand-name">Kopi Mase</h1>
            <nav class="site-nav">
                <ul class="nav-list">
                    <li><a href="index.html">Beranda</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="pesan.html">Pesan</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container site-main">
        <h2>Formulir Pemesanan Online</h2>
        <form class="order-form" action="pesan.html" method="get">
            <div class="form-group">
                <label for="nama">Nama Pemesan:</label>
                <input type="text" id="nama" name="nama" required>
            </div>

            <div class="form-group">
                <label for="whatsapp">Nomor WhatsApp:</label>
                <input type="tel" id="whatsapp" name="whatsapp" required>
            </div>

            <div class="form-group">
                <label for="pilihan_menu">Pilihan Menu:</label>
                <select id="pilihan_menu" name="pilihan_menu" required>
                    <option value="">-- Pilih Menu Kedai --</option>
                    <optgroup label="Kopi">
                        <option value="Espresso">Espresso - Rp18.000</option>
                        <option value="Cafe Latte">Cafe Latte - Rp25.000</option>
                        <option value="Cappuccino">Cappuccino - Rp25.000</option>
                    </optgroup>
                    <optgroup label="Non Kopi">
                        <option value="Matcha Latte">Matcha Latte - Rp28.000</option>
                        <option value="Chocolate Classic">Chocolate Classic - Rp24.000</option>
                        <option value="Lemon Tea">Lemon Tea - Rp20.000</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label for="jumlah">Jumlah (1 - 10):</label>
                <input type="number" id="jumlah" name="jumlah" min="1" max="10" required>
            </div>

            <div class="form-group">
                <p class="form-label-title">Cara Ambil:</p>
                <div class="radio-group">
                    <label class="radio-option" for="ambil_tempat">
                        <input type="radio" id="ambil_tempat" name="cara_ambil" value="Ambil di tempat" required>
                        <span>Ambil di tempat</span>
                    </label>
                    <label class="radio-option" for="diantar">
                        <input type="radio" id="diantar" name="cara_ambil" value="Diantar">
                        <span>Diantar</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="catatan">Catatan Tambahan:</label>
                <textarea id="catatan" name="catatan" rows="4"></textarea>
            </div>

            <button class="submit-btn" type="submit">Kirim Pesanan</button>
        </form>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Alamat: Jl. Subagyo No. 67, Banyumas</p>
        </div>
    </footer>
</body>
</html>
